<!DOCTYPE h>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Vitrine</title>
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/tokyo-night-dark.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Inter, Roboto, 'Helvetica Neue', 'Arial Nova', 'Nimbus Sans', Arial, sans-serif;
      margin: 0;
    }
    a {
      text-decoration: none;

      &:hover {
        text-decoration: underline;
      }
    }
    #root {
      display: grid;
      grid-template: auto 1fr / 200px 1fr;
      height: 100%;

      &:has(.preview) {
        background: conic-gradient(
            #0002 90deg,
            #0000 90deg 180deg,
            #0002 180deg 270deg,
            #0000 270deg
          )
          top / 2em 2em;
      }
    }
    aside {
      grid-row: 1 / -1;
      box-shadow: 0 0 16px #0001, 0 0 8px #0002, 0 0 4px #0003;
      background: #fff;
      max-height: 100vh;
      line-height: 1.5;
      font-size: 14px;
      overflow: scroll;

      summary {
        cursor: pointer;
        list-style: none;
      }
      
      h1 {
        text-align: center;
        a {
          color: inherit;
          padding:1em;
        }
      }
      
      ul {
        list-style: none;
        padding: 0;
      }
      
      summary, li > a {
        padding: 0 .5em .25em 1em;
        display: flex;
        justify-content: space-between;
        user-select: none;
        &:hover {
          background: #00f1;
        }
        
        ul ul & {
          padding-left: 2em;
        }
        ul ul ul & {
          padding-left: 3em;
        }
        ul ul ul ul & {
          padding-left: 4em;
        }
        ul ul ul ul ul & {
          padding-left: 5em;
        }
      }
      
      summary::after {
        opacity: .25;
        content: '⏵';
      }
      
      details[open] > summary::after {
        content: '⏷';
      }
    }
    .documentation {
      font-family: Merriweather, Rockwell, 'Rockwell Nova', 'Roboto Slab', 'DejaVu Serif', 'Sitka Small', serif;
      grid-area: 1 / 2 / 3 / 3;
      line-height: 1.75;
      color: #000b;
      padding: 2rem max(clamp(2rem, 5vw, 5rem), 100% - 960px - 5rem) 2rem clamp(2rem, 5vw, 5rem);
      overflow-x: scroll;

      h1, h2, h3, h4, h5, h6 {
        color: #000;
        margin: 0 0 1rem;
      }

      ul, ol, p, pre, table {
        margin: 0 0 2rem;
      }
    }
    .showcase {
      height: 100vh;
      overflow: auto;
      
      .components {
        display: grid;
        grid: auto / repeat(auto-fill, minmax(20rem, 1fr));
        gap: 3rem;
        padding: 0 1rem;
        
        h2 {
          grid-column: 1 / -1;
        }
      }
      
      .component {
      }

      .example {
        max-height: 20rem;
        overflow: hidden;
        display: grid;

        .example-link,
        .example__pane {
          grid-area: 1 / 1;
        }

        .example__pane {
          width: 100vw;
          pointer-events: none;
        }
      }
      
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
      }
    }
    .preview {
      background: #fff;
      border: 3px ridge;
      height: 50vh;
      justify-self: center;
      max-width: calc(100vw - 200px);
      overflow: auto;
      position: relative;
      resize: both;
      width: min(100% - 32px, 1364px);

      iframe {
        border: 0;
        height: 100%;
        width: 100%;
      }
    }
    .fullscreen {
      position: absolute;
      opacity: .25;
      color: black;
      font-weight: bold;
      padding: 0 .25em;
      right: 1em;
      &:hover {
        opacity: 1;
        text-decoration: none;
      }
    }
    .files {
      display: flex;
      flex-flow: row wrap;
      gap: 0 .25em;
      container-type: size;

      > div {
        display: contents;
      }

      > div > a {
        padding: .25em .5em;
        text-align: center;
        background: #555;
        border-radius: .5em .5em 0 0;
        color: #fff;
        order: -1;

        &:hover {
          text-decoration: none;
        }
      }

      a:target {
        background: #1a1b26;

        + .file {
          display: grid;
        }
      }

      &:not(:has(:target)) {
        > div:first-child > a {
          background: #1a1b26;

          + .file {
            display: grid;
          }
        }
      }

      .file {
        display: none;
        width: 100%;
        height: calc(100cqh - 1.75rem);
        overflow: scroll;
      }

      pre {
        margin: 0;
        code {
          min-height: 100%;
          padding-top: 2em;
        }
      }
    }
    </style>
  </head>
  <body>
    <div id="root">
      <aside>
        <h1><a :href="server.prefix">vitrine</a></h1>
        <RecursiveList :data="components.toArray()" />
      </aside>
      <main v-if="typeof component === 'undefined'" class="documentation">
        <h1>404'd!</h1>
      </main>
      <main v-else-if="component.url === undefined" class="documentation">
        <script
          v-if="components.toArray().find(c => c.url)?.url"
          v-html="`window.location = '${components.toArray().find(c => c.url).url}'`"
        ></script>
        <h1>Welcome!</h1>
        <h2>This is your component library.</h2>
        <p>
          You don't have any components yet. If you do have some compoments,
          <template v-if="server.basePaths.length">
            make sure that they are in: <code>{{ server.basePaths.map(p => p.dir).join(", ") }}</code>
          </template>
          <template v-else>
            make sure to configure Vitrine's <code>basePaths</code>.
          </template>
        </p>
      </main>
      <main
        v-if="component?.type === 'directory'"
        class="showcase"
      >
        <a class="fullscreen" target="_parent" :href="component.url + '/@html'">⛶</a>
        <iframe :src="component.url + '/@html'"></iframe>
      </main>
      <main
        v-else-if="component?.filetype === 'md'"
        class="documentation"
        v-html="markdown(code)">
      </main>
      <template v-else-if="component">
        <main class="preview" id="app">
          <a class="fullscreen" :href="component.url + '/@html'">⛶</a>
          <iframe :src="component.url + '/@html'"></iframe>
        </main>
        <div class="files">
          <div v-for="(file, i) in related">
            <a :href="`#${i == 0 ? '' : file.slug}`" :id="file.slug">{{ file.name }}</a>
            <div class="file">
              <pre><code>{{ encode(file.code) }}</code></pre>
            </div>
          </div>
        </div>
      </template>
    </div>
    <script>hljs.highlightAll()</script>
    <script v-if="isServer" type="module" src="/@vite/client"></script>
  </body>
</html>
