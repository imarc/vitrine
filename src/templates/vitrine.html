<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Components</title>
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      font-size: 16px;
      margin: 0;
    }
    a {
      text-decoration: none;
    }
    #root {
      display: grid;
      grid-template: auto 1fr / 200px auto;
      height: 100%;
    }
    #root:has(.preview) {
      background: conic-gradient(#0002 90deg, #0000 90deg, #0000 180deg, #0002 180deg, #0002 270deg, #0000 270deg) top / 2em 2em;
    }
    aside {
      background: #fff;
      box-shadow: 0 0 1rem #0002;
      grid-area: 1 / 1 / 3 / 2;
      padding: 1em;
      max-height: 100vh;
      overflow: scroll;

      ul {
        list-style: none;
        padding-left: 0;
        ul {
          padding-left: 1em;
        }
      }

      summary {
        cursor: pointer;
      }
    }
    .documentation {
      grid-area: 1 / 2 / 3 / 3;
      padding: 1em;
    }
    .preview {
      background: #fff;
      border: 3px ridge;
      height: 50vh;
      justify-self: center;
      max-width: calc(100vw  - 200px);
      overflow: auto;
      resize: both;
      width: min(100% - 32px, 1364px);

      iframe {
        border: 0;
        height: 100%;
        width: 100%;
      }
    }
    .code {
      align-items: start;
      color: white;
      display: grid;
      font-size: inherit;
      margin: 0;
      overflow: auto;

      nav, pre {
        grid-area: 1 / 1 / 2 / 2;
      }

      nav {
        a {
          border-bottom: 1px solid #fff8;
          color: #fff8;
          display: inline flex;
          font-family: monospace;
          padding: .25em .5em;
        }

        a.active {
          box-shadow: 0 -2px 0 inset;
          color: #fff;
        }

        a:hover {
          background: #0002;
          color: #fff;
        }
      }

      pre {
        margin: 0;
        code {
          min-height: 100%;
          padding-top: 2em;
        }
      }
    }
    </style>
  </head>
  <body>
    <div id="root">
      <aside>
        <h1><a :href="server.prefix">Components</a></h1>
        <RecursiveList :data="components.toArray()" />
      </aside>
      <main v-if="typeof component === 'undefined'" class="documentation">
        <h1>404'd!</h1>
      </main>
      <main v-else-if="component.url === undefined" class="documentation">
        <h1>Overview</h1>
        <p>
          Consectetur sit ducimus fuga maxime nihil nisi illo harum? Nihil assumenda voluptatibus eius tenetur rem Incidunt necessitatibus vel odio consequatur voluptates, est Asperiores eius accusamus soluta rem incidunt, in? Rem.
        </p>
      </main>
      <template v-else>
        <main class="preview">
          <iframe :src="component.url + '?html'"></iframe>
        </main>
        <div class="code">
          <pre><code>{{ code }}</code></pre>
          <nav>
            <a
              v-for="file in related"
              :href="file.url"
              :class="{ active: viewingFile === file.name }"
              >{{ file.name }}</a>
          </nav>
        </div>
      </template>
    </div>
    <script>hljs.highlightAll()</script>
  </body>
</html>
